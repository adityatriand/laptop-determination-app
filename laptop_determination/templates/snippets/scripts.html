{% load static %}
<script src=" {% static 'vendor/plugins/jquery/jquery.min.js' %} "></script>
<!-- jQuery UI 1.11.4 -->
<script src="{% static 'vendor/plugins/jquery-ui/jquery-ui.min.js' %}"></script>
<!-- Resolve conflict in jQuery UI tooltip with Bootstrap tooltip -->
<script>
$.widget.bridge('uibutton', $.ui.button)
</script>
<!-- Bootstrap 4 -->
<script src=" {% static 'vendor/plugins/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
<!-- overlayScrollbars -->
<script src=" {% static 'vendor/plugins/overlayScrollbars/js/jquery.overlayScrollbars.min.js' %} "></script>
<!-- AdminLTE App -->
<script src=" {% static 'vendor/dist/js/adminlte.js' %} "></script>
<!-- Select2 -->
<script src="{% static 'vendor/plugins/select2/js/select2.full.min.js' %}"></script>

<script src="{% static 'vendor/plugins/datatables/jquery.dataTables.min.js' %}"></script>
<script src="{% static 'vendor/plugins/datatables-bs4/js/dataTables.bootstrap4.min.js' %}"></script>
<script>
$(document).ready(function() {
    $('#table_dataset').DataTable();
    $('.select2bs4').select2({
        theme: 'bootstrap4'
    });

    const PriorityManager = {
        TOTAL_PRIORITIES: 5,
        EMPTY_VALUE: 'empty',
        NOTIFICATION_MESSAGE: 'Jika mengubah salah satu tingkat kepentingan maka harus mengubah semua',
        
        priorities: [],
        
        init() {
            for (let i = 1; i <= this.TOTAL_PRIORITIES; i++) {
                this.priorities[i] = $(`#priority_${i}`).val();
            }
        },
        
        updateOption(priorityIndex, selectedValue) {
            if (selectedValue !== this.EMPTY_VALUE) {
                for (let i = 1; i <= this.TOTAL_PRIORITIES; i++) {
                    if (i !== priorityIndex) {
                        $(`#priority_${i} option[value='${selectedValue}']`).remove();
                    }
                }
            } else {
                const previousChoice = this.priorities[priorityIndex];
                if (previousChoice !== this.EMPTY_VALUE) {
                    const option = `<option value='${previousChoice}'>${previousChoice}</option>`;
                    for (let i = 1; i <= this.TOTAL_PRIORITIES; i++) {
                        if (i !== priorityIndex) {
                            $(`#priority_${i}`).append(option);
                        }
                    }
                }
            }
        },
        
        showNotification() {
            $('#notification')
                .text(this.NOTIFICATION_MESSAGE)
                .show()
                .delay(3000)
                .fadeOut();
        },
        
        updateSearchButtonState() {
            const allEmpty = this.priorities.slice(1).every(val => val === this.EMPTY_VALUE);
            const allFilled = this.priorities.slice(1).every(val => val !== this.EMPTY_VALUE);
            
            if (allEmpty || allFilled) {
                $('#cari').removeAttr('disabled');
            } else {
                $('#cari').attr('disabled', 'disabled');
            }
        },
        
        handlePriorityChange(priorityIndex) {
            const selectedValue = $(`#priority_${priorityIndex}`).val();
            
            this.priorities[priorityIndex] = selectedValue;
            
            this.updateOption(priorityIndex, selectedValue);
            
            this.showNotification();
            
            this.updateSearchButtonState();
        }
    };

    PriorityManager.init();

    for (let i = 1; i <= PriorityManager.TOTAL_PRIORITIES; i++) {
        $(`#priority_${i}`).change(function() {
            PriorityManager.handlePriorityChange(i);
        });
    }

    $('#reset_penting').click(function() {
        location.reload();
    });
    
    $('#perhitungan').click(function() {
        const detailElement = $('#detail_perhitungan');
        const isVisible = detailElement.attr('tanda') === '1';
        
        if (isVisible) {
            detailElement.attr('tanda', '0').hide();
            $(this).html('Lihat Perhitungan');
        } else {
            detailElement.attr('tanda', '1').show();
            $(this).html('Sembunyikan Perhitungan');
        }
    });
});
</script>
