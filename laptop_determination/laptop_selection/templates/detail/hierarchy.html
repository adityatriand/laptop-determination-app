{% load laptop_selection_extras %}
<table class="table table-bordered">
<caption style="caption-side:top;">Tujuan</caption>
  <thead>
    <tr>
      <th>Penentuan Laptop</th>
    </tr>
  </thead>
</table>
<table class="table table-bordered">
<caption style="caption-side:top;">Criteria</caption>
  <thead>
    <tr>
      <th>CPU</th>
      <th>Harga</th>
      <th>RAM</th>
      <th>SSD</th>
      <th>HDD</th>
    </tr>
  </thead>
</table>
<div class="table-responsive">
<table class="table table-bordered table-size">
  <caption style="caption-side:top;">Alternatif</caption>
  <thead class="table-responsif">
    <tr>
      {% for data in alternatives %}
      <th>Laptop {{ forloop.counter }}</th>
      {% endfor %}
    </tr>
  </thead>
</table>
</div>
